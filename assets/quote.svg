<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 140" width="100%" height="140">
  <defs>
    <linearGradient id="q-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080a" />
      <stop offset="50%" stop-color="#140608" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>
    <linearGradient id="q-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <filter id="q-glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="860" height="140" rx="12" fill="url(#q-bg)" stroke="url(#q-border)" stroke-width="1.3" />

  <!-- Corner Cyber Accents -->
  <path d="M 10 24 L 10 10 L 24 10" stroke="#ff2a45" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 850 24 L 850 10 L 836 10" stroke="#ff2a45" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 10 116 L 10 130 L 24 130" stroke="#ff2a45" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 850 116 L 850 130 L 836 130" stroke="#ff2a45" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Big Quote Mark -->
  <text x="34" y="66" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#ff2a45" opacity="0.9" filter="url(#q-glow)">&#8220;</text>

  <!-- Quote Text Line 1 -->
  <text x="74" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-style="italic" font-weight="600" fill="#ffffff" letter-spacing="0.5">
    &#8220;Driven by curiosity. Building for impact. Coding the future.&#8221;
  </text>

  <!-- Quote Text Line 2 -->
  <text x="74" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-style="italic" font-weight="400" fill="#cbd5e1" letter-spacing="0.3">
    &#8220;I enjoy turning ideas into practical software solutions.&#8221;
  </text>

  <!-- Attribution Line -->
  <text x="815" y="112" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ef4444" letter-spacing="1.5">
    &#8212; SRIKANTH YADAV <tspan fill="#64748b" font-weight="500">| DEVELOPER PHILOSOPHY</tspan>
  </text>
</svg>