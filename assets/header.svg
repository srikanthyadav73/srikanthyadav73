<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="250">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060608" />
      <stop offset="50%" stop-color="#120608" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Red Neon Flow Gradient for Text -->
    <linearGradient id="red-glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b53" />
      <stop offset="35%" stop-color="#ff1a35" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#ff1a35" />
      <stop offset="100%" stop-color="#ff3b53" />
      <animate attributeName="x1" from="-100%" to="100%" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="6s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="25%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#ff4d6d" />
      <stop offset="75%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0" />
      <stop offset="30%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff4d6d" stop-opacity="1" />
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambient-blur">
      <feGaussianBlur stdDeviation="45" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ef4444" stroke-width="0.7" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 44px;
      letter-spacing: 5px;
      text-transform: uppercase;
    }
    .primary-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 3.5px;
      text-transform: uppercase;
    }
    .roles-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: #cbd5e1;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 2px;
      fill: #f87171;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #ff4d6d;
    }
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0.4; r: 3.5px; }
      50% { opacity: 1; r: 5.5px; }
      100% { opacity: 0.4; r: 3.5px; }
    }
  </style>

  <!-- Background Rect -->
  <rect width="920" height="250" rx="14" fill="url(#bg-grad)" />

  <!-- Ambient Red Glows -->
  <circle cx="160" cy="70" r="100" fill="#dc2626" opacity="0.18" filter="url(#ambient-blur)" />
  <circle cx="760" cy="140" r="120" fill="#ff1a35" opacity="0.15" filter="url(#ambient-blur)" />

  <!-- Subtle Tech Grid -->
  <rect width="920" height="250" rx="14" fill="url(#tech-grid)" />

  <!-- Border Outline -->
  <rect x="1.5" y="1.5" width="917" height="247" rx="13" fill="none" stroke="url(#border-grad)" stroke-width="1.5" stroke-opacity="0.75" />

  <!-- Cybernetic Corner Accents -->
  <!-- Top-Left -->
  <path d="M 12 32 L 12 14 L 32 14" stroke="#ff2a45" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- Top-Right -->
  <path d="M 908 32 L 908 14 L 888 14" stroke="#ff2a45" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- Bottom-Left -->
  <path d="M 12 218 L 12 236 L 32 236" stroke="#ff2a45" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- Bottom-Right -->
  <path d="M 908 218 L 908 236 L 888 236" stroke="#ff2a45" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Status Pill Badge at Top Center -->
  <g transform="translate(310, 22)">
    <rect width="300" height="26" rx="13" fill="#17090b" stroke="#ff2a45" stroke-width="1" stroke-opacity="0.8" />
    <circle cx="20" cy="13" r="4.5" fill="#ef4444" class="pulse-dot" />
    <text x="160" y="17.2" text-anchor="middle" class="badge-text">B.TECH CSE 2025 • PORTFOLIO</text>
  </g>

  <!-- Main Name Header -->
  <text x="460" y="98" text-anchor="middle" class="title-text" fill="url(#red-glow-grad)" filter="url(#glow-red)">
    SRIKANTH YADAV
  </text>
  <text x="460" y="98" text-anchor="middle" class="title-text" fill="#ffffff" fill-opacity="0.95">
    SRIKANTH YADAV
  </text>

  <!-- Primary Title -->
  <text x="460" y="132" text-anchor="middle" class="primary-title">
    <tspan fill="#ff4d6d">COMPUTER SCIENCE ENGINEER</tspan>
  </text>

  <!-- Secondary Specializations -->
  <text x="460" y="158" text-anchor="middle" class="roles-text">
    <tspan fill="#ffffff">FULL STACK DEVELOPER</tspan>
    <tspan fill="#ef4444"> &#8226; </tspan>
    <tspan fill="#ffffff">PYTHON DEVELOPER</tspan>
    <tspan fill="#ef4444"> &#8226; </tspan>
    <tspan fill="#ffffff">AI &amp; DATA ENTHUSIAST</tspan>
  </text>

  <!-- Decorative Sleek Red Line with Diamond -->
  <g transform="translate(0, 180)">
    <line x1="180" y1="0" x2="435" y2="0" stroke="url(#line-grad)" stroke-width="1.5" />
    <polygon points="460,-5 466,0 460,5 454,0" fill="#ff2a45" filter="url(#soft-glow)" />
    <circle cx="440" cy="0" r="2" fill="#ef4444" />
    <circle cx="480" cy="0" r="2" fill="#ef4444" />
    <line x1="485" y1="0" x2="740" y2="0" stroke="url(#line-grad)" stroke-width="1.5" />
  </g>

  <!-- Tagline Quote at Bottom -->
  <g transform="translate(460, 216)">
    <text text-anchor="middle" class="tagline-text">
      <tspan fill="#ef4444" font-weight="bold">&lt;/&gt;</tspan>
      <tspan fill="#e2e8f0"> &#8220;Turning Ideas Into Intelligent Digital Solutions&#8221; </tspan>
      <tspan fill="#ef4444" font-weight="bold">&lt;/&gt;</tspan>
    </text>
  </g>
</svg>