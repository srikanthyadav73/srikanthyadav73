<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <linearGradient id="div-grad-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0" />
      <stop offset="80%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff4d6d" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="div-grad-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d6d" stop-opacity="1" />
      <stop offset="20%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
    <filter id="d-glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left line -->
  <line x1="80" y1="12" x2="435" y2="12" stroke="url(#div-grad-left)" stroke-width="1.5" />
  <!-- Center elements -->
  <circle cx="438" cy="12" r="2" fill="#ef4444" />
  <polygon points="450,6 456,12 450,18 444,12" fill="#ff2a45" filter="url(#d-glow)" />
  <circle cx="462" cy="12" r="2" fill="#ef4444" />
  <!-- Right line -->
  <line x1="465" y1="12" x2="820" y2="12" stroke="url(#div-grad-right)" stroke-width="1.5" />
</svg>
